name: couchlog

on:
  push:
    branches: [go-rewrite]
    paths: ["couchlog/**", ".github/workflows/couchlog.yml"]
  pull_request:
    paths: ["couchlog/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: couchlog
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: couchlog/go.mod
          cache-dependency-path: couchlog/go.sum
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os == 'Linux'
      - run: go test ./...
        if: runner.os != 'Linux'

  # The dashboard is built into internal/web/dist and embedded in the binary,
  # so plain `go build` needs no Node. This checks the committed build matches
  # the source.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: couchlog/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: couchlog/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Committed build is up to date
        run: git diff --exit-code --stat -- ../internal/web/dist && test -z "$(git status --porcelain -- ../internal/web/dist)"

  # Couchlog's own TMDB key, from the repository secret: the same one release
  # builds get at compile time. Skipped where secrets are not available
  # (pull requests from forks).
  tmdb-live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: couchlog
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: couchlog/go.mod
          cache-dependency-path: couchlog/go.sum
      - name: TMDB with the built-in key
        env:
          COUCHLOG_TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$COUCHLOG_TMDB_KEY" ]; then echo "No TMDB_API_KEY secret here: skipped"; exit 0; fi
          go test ./internal/identify -run Live -v -count=1
